[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-cdc-data-pipeline"
version = "0.1.0"
description = "A local SQLite-backed CDC pipeline for customer events"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cdc-pipeline = "cdc_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]